# Spelling gate: American English only (see AGENTS.md, "Language").
[default]
locale = "en-us"

# Exact token fixtures in which a short run of letters spells a word. Each is
# listed in full, so no real word can hide behind it. Add a token here when a
# new vector trips the check.
extend-ignore-re = [
    "ADxNbSxJmIyI9eq6tuWXE7R9apb",
    "AY0iAFoFs10QSwB6QlaGs0srE6gbb2QIHVEvPkAcNxw",
    "BUreBVbi5iMU",
    "BUt6SRL-hJFWEmpUa2zYHsiSLJb",
    "ECnN3EEOtKRlP-BhkhCyzStFStV5AQJrRujtZLEsHtTH7SyFv_T8dulUBcOyiDtz6u2wlcbgVWfqJUM8374ECX4qGI",
    "ES5upAkODY4Q",
    "HGV8DZXq8erFSc1wNdNsNwm2a8DYMmr5Zh_LQ6MAowW1OfsFgQQb-8jVGc_4s9b7P9F7n1kqBP3jg0Ob6JOQjshjFY",
    "JNcDsK0IYUsw",
    "M3Fo9OBFtLeH",
]

[default.extend-words]
# A facelet string in a test vector, not a word.
FLUD = "FLUD"

# British spellings that the en-us dictionary does not flag by itself.
binarisation = "binarization"
binarisations = "binarizations"
binarise = "binarize"
binarised = "binarized"
binariser = "binarizer"
binarisers = "binarizers"
binarises = "binarizes"
binarising = "binarizing"
cancelled = "canceled"
canonicalisation = "canonicalization"
canonicalisations = "canonicalizations"
canonicalise = "canonicalize"
canonicalised = "canonicalized"
canonicaliser = "canonicalizer"
