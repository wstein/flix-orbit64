# Spelling gate: American English only (see AGENTS.md, "Language").
[default]
locale = "en-us"
# Tokens such as `BUreBVbi5iMU` are data, not prose: skip quoted base64url
# runs and long unquoted ones. Identifiers are still checked.
extend-ignore-re = [
    "[\"`][A-Za-z0-9_-]{5,}[\"`]",
    "[ ][A-Za-z0-9_-]{25,}",
]

[default.extend-words]
# A facelet string in a test vector, not a word.
FLUD = "FLUD"

[files]
extend-exclude = [
    "LICENSE",
    ".flixw/",
    # Encoded algorithm files are data, not prose.
    "*.orbit64",
]
