# Prettier with prettier-plugin-flix does the formatting. `./flixw format` is the
# compiler's own formatter verb, and compiler verbs win over tasks, so these
# tasks use other names. The globs are those of format:check in package.json.
fmt       = "npx prettier --write \"src/**/*.flix\" \"test/**/*.flix\" \"examples/*/src/**/*.flix\" \"examples/*/test/**/*.flix\""
fmt-check = "npm run format:check"
