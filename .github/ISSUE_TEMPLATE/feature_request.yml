name: Feature request
description: Suggest a library feature or documentation improvement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe what you want to do and what currently prevents it.
    validations:
      required: true
  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested change
      description: Describe the behavior or API you have in mind. An example token, facelet layout, or Flix call helps when relevant.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Say whether the proposal would change existing tokens, orbit or facelet order, or the published format in FORMAT.md.
